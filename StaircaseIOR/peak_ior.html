<!DOCTYPE html>
<html>
<head>
    <title>Peak IOR Experiment</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            background-color: black;
        }
        .jspsych-content {
            max-width: 100%;
        }
        .jspsych-content-wrapper {
            background-color: black;
        }
        .trial-container {
            position: relative;
            width: 800px;
            height: 400px;
            margin: 0 auto;
            background-color: black;
        }
        .fixation {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: white;
            font-family: Arial, sans-serif;
        }
        .box {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid white;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        .left-box {
            left: 150px;
        }
        .right-box {
            right: 150px;
        }
        .cue, .target {
            position: absolute;
            width: 74px;
            height: 74px;
            background-color: white;
            top: 50%;
            transform: translateY(-50%);
        }
        .cue-left, .target-left {
            left: 153px;
        }
        .cue-right, .target-right {
            right: 153px;
        }
        .instructions {
            color: white;
            font-size: 20px;
            line-height: 1.6;
            max-width: 700px;
            margin: 0 auto;
            text-align: left;
        }
        .instructions h2 {
            text-align: center;
        }
        .continue-text {
            text-align: center;
            margin-top: 30px;
            color: #aaa;
        }
        .feedback {
            color: white;
            font-size: 32px;
            text-align: center;
        }
        .feedback.error {
            color: #ff6666;
        }
        .results {
            color: white;
            font-size: 24px;
            line-height: 1.8;
            text-align: center;
        }
    </style>
</head>
<body></body>
<script>
// =============================================================================
// PEAK IOR EXPERIMENT - Two-Tracker Staircase
// =============================================================================
// X-tracker: Maps IOR at different SOAs to determine slope/direction
// Y-tracker: Remembers the best (highest) IOR and where it occurred
//
// This approach navigates the inverted-U function properly by knowing
// which side of the peak we're on.
// =============================================================================

// --- Staircase Parameters ---
const MIN_SOA = 100;
const MAX_SOA = 800;
const START_SOA = 300;
const STEP_SIZE_INITIAL = 75;
const STEP_SIZE_MIN = 15;
const N_REVERSALS = 12;
const N_TRIALS_MAX = 250;
const MIN_TRIALS_PER_SOA = 4;  // Need this many valid+invalid trials before estimating IOR at an SOA
const SOA_BIN_WIDTH = 50;      // Group SOAs within this range together

// --- Timing Parameters (in ms) ---
const FIXATION_DURATION = 750;
const CUE_DURATION = 50;
const TARGET_DURATION = 1000;

// --- Practice Parameters ---
const N_PRACTICE_TRIALS = 15;
const PRACTICE_SOAS = [150, 300, 450];

// --- X-Tracker: SOA → IOR Map ---
// Stores RTs at each SOA bin to compute IOR estimates
let xTracker = {
    // Map of SOA bin center → { validRTs: [], invalidRTs: [] }
    soaBins: new Map(),

    // Get the bin center for a given SOA
    getBinCenter(soa) {
        return Math.round(soa / SOA_BIN_WIDTH) * SOA_BIN_WIDTH;
    },

    // Add an RT to the appropriate bin
    addRT(soa, rt, validity) {
        const bin = this.getBinCenter(soa);
        if (!this.soaBins.has(bin)) {
            this.soaBins.set(bin, { validRTs: [], invalidRTs: [] });
        }
        if (validity === 'valid') {
            this.soaBins.get(bin).validRTs.push(rt);
        } else {
            this.soaBins.get(bin).invalidRTs.push(rt);
        }
    },

    // Get IOR estimate at a specific SOA bin (null if not enough data)
    getIOR(soa) {
        const bin = this.getBinCenter(soa);
        const data = this.soaBins.get(bin);

        if (!data) return null;
        if (data.validRTs.length < MIN_TRIALS_PER_SOA / 2) return null;
        if (data.invalidRTs.length < MIN_TRIALS_PER_SOA / 2) return null;

        const meanValid = data.validRTs.reduce((a, b) => a + b, 0) / data.validRTs.length;
        const meanInvalid = data.invalidRTs.reduce((a, b) => a + b, 0) / data.invalidRTs.length;

        // IOR = valid - invalid (positive = IOR present)
        return meanValid - meanInvalid;
    },

    // Get all SOA bins that have enough data
    getValidBins() {
        const bins = [];
        for (const [soa, data] of this.soaBins) {
            if (data.validRTs.length >= MIN_TRIALS_PER_SOA / 2 &&
                data.invalidRTs.length >= MIN_TRIALS_PER_SOA / 2) {
                bins.push({ soa, ior: this.getIOR(soa) });
            }
        }
        return bins.sort((a, b) => a.soa - b.soa);
    },

    // Determine which direction to go based on slope
    getDirection(currentSOA) {
        const currentBin = this.getBinCenter(currentSOA);
        const currentIOR = this.getIOR(currentSOA);

        if (currentIOR === null) return null;  // Not enough data

        // Look for neighboring bins with data
        const lowerBin = currentBin - SOA_BIN_WIDTH;
        const upperBin = currentBin + SOA_BIN_WIDTH;

        const lowerIOR = this.getIOR(lowerBin);
        const upperIOR = this.getIOR(upperBin);

        // If we have both neighbors, compare them
        if (lowerIOR !== null && upperIOR !== null) {
            if (lowerIOR > currentIOR && upperIOR < currentIOR) {
                return 'down';  // Peak is to the left
            } else if (upperIOR > currentIOR && lowerIOR < currentIOR) {
                return 'up';    // Peak is to the right
            } else if (lowerIOR < currentIOR && upperIOR < currentIOR) {
                return 'stay';  // We're at the peak!
            }
        }

        // If we only have one neighbor, use that
        if (lowerIOR !== null && upperIOR === null) {
            return lowerIOR > currentIOR ? 'down' : 'up';
        }
        if (upperIOR !== null && lowerIOR === null) {
            return upperIOR > currentIOR ? 'up' : 'down';
        }

        return null;  // No neighbors with data
    }
};

// --- Y-Tracker: Best IOR Found ---
let yTracker = {
    bestSOA: START_SOA,
    bestIOR: -Infinity,

    // Update if we found a better IOR
    update(soa, ior) {
        if (ior !== null && ior > this.bestIOR) {
            this.bestIOR = ior;
            this.bestSOA = soa;
            return true;  // New best found
        }
        return false;
    }
};

// --- Staircase State ---
let staircase = {
    currentSOA: START_SOA,
    stepSize: STEP_SIZE_INITIAL,
    lastDirection: null,
    reversals: [],
    soaHistory: [],
    needsExploration: true  // Start by exploring
};

// --- Current Trial Variables ---
let currentTrial = {
    cueSide: 'left',
    targetSide: 'left',
    validity: 'valid',
    correctResponse: 'f',
    soa: 300,
    isPractice: false
};

// --- Trial Counter ---
let mainTrialCount = 0;
let practiceTrialCount = 0;

// --- Staircase Logic ---
function updateStaircase() {
    const currentIOR = xTracker.getIOR(staircase.currentSOA);

    // Update Y-tracker
    if (currentIOR !== null) {
        yTracker.update(staircase.currentSOA, currentIOR);
    }

    // Get direction from X-tracker
    const direction = xTracker.getDirection(staircase.currentSOA);

    let reversal = false;
    let newDirection = staircase.lastDirection;

    if (direction === null) {
        // Not enough data - keep exploring current region
        // Alternate directions to gather data
        if (staircase.needsExploration) {
            newDirection = staircase.lastDirection === 'up' ? 'down' : 'up';
            staircase.needsExploration = false;
        } else {
            // Small random jitter to explore
            newDirection = Math.random() < 0.5 ? 'up' : 'down';
        }
    } else if (direction === 'stay') {
        // We're at the peak! Reduce step size and jitter around
        staircase.stepSize = Math.max(STEP_SIZE_MIN, staircase.stepSize * 0.7);
        newDirection = Math.random() < 0.5 ? 'up' : 'down';
        reversal = true;
        staircase.reversals.push(staircase.currentSOA);
        console.log(`At peak! SOA = ${staircase.currentSOA}ms, IOR = ${currentIOR?.toFixed(1)}ms`);
    } else {
        // X-tracker says go 'up' or 'down'
        if (staircase.lastDirection !== null && direction !== staircase.lastDirection) {
            // Direction changed = reversal
            reversal = true;
            staircase.reversals.push(staircase.currentSOA);
            staircase.stepSize = Math.max(STEP_SIZE_MIN, staircase.stepSize * 0.7);
            console.log(`Reversal ${staircase.reversals.length}: SOA = ${staircase.currentSOA}ms, IOR = ${currentIOR?.toFixed(1)}ms`);
        }
        newDirection = direction;
    }

    // Apply the step
    if (newDirection === 'up') {
        staircase.currentSOA = Math.min(MAX_SOA, staircase.currentSOA + staircase.stepSize);
    } else if (newDirection === 'down') {
        staircase.currentSOA = Math.max(MIN_SOA, staircase.currentSOA - staircase.stepSize);
    }

    staircase.lastDirection = newDirection;
    staircase.soaHistory.push(staircase.currentSOA);

    return { reversal, direction: newDirection };
}

function shouldUpdateStaircase() {
    // Update when we have some data at the current SOA
    const bin = xTracker.getBinCenter(staircase.currentSOA);
    const data = xTracker.soaBins.get(bin);

    if (!data) return false;

    // Need at least a few trials at this SOA before deciding
    return (data.validRTs.length + data.invalidRTs.length) >= MIN_TRIALS_PER_SOA;
}

function isStaircaseFinished() {
    return staircase.reversals.length >= N_REVERSALS;
}

function getPeakSOA() {
    // Primary: Use Y-tracker's best SOA
    // Secondary: Average of reversals as confirmation

    if (staircase.reversals.length >= 4) {
        const nUse = Math.min(8, staircase.reversals.length);
        const reversalMean = staircase.reversals.slice(-nUse).reduce((a, b) => a + b, 0) / nUse;

        // Return average of Y-tracker and reversal mean
        return (yTracker.bestSOA + reversalMean) / 2;
    }

    return yTracker.bestSOA;
}

function getMaxIOR() {
    return yTracker.bestIOR > -Infinity ? yTracker.bestIOR : 0;
}

// Generate trial stimulus HTML
function generateTrialHTML(phase) {
    let html = '<div class="trial-container">';
    html += '<div class="fixation">+</div>';
    html += '<div class="box left-box"></div>';
    html += '<div class="box right-box"></div>';

    if (phase === 'cue') {
        html += `<div class="cue cue-${currentTrial.cueSide}"></div>`;
    }

    if (phase === 'target') {
        html += `<div class="target target-${currentTrial.targetSide}"></div>`;
    }

    html += '</div>';
    return html;
}

// Setup a new trial
function setupNewTrial(isPractice) {
    currentTrial.isPractice = isPractice;
    currentTrial.cueSide = Math.random() < 0.5 ? 'left' : 'right';
    currentTrial.validity = Math.random() < 0.5 ? 'valid' : 'invalid';
    currentTrial.targetSide = currentTrial.validity === 'valid' ?
        currentTrial.cueSide :
        (currentTrial.cueSide === 'left' ? 'right' : 'left');
    currentTrial.correctResponse = currentTrial.targetSide === 'left' ? 'f' : 'j';

    if (isPractice) {
        currentTrial.soa = PRACTICE_SOAS[Math.floor(Math.random() * PRACTICE_SOAS.length)];
    } else {
        currentTrial.soa = staircase.currentSOA;
    }
}

// =============================================================================
// INITIALIZE JSPSYCH
// =============================================================================
const jsPsych = initJsPsych({
    on_finish: function() {
        const peakSOA = getPeakSOA();
        const maxIOR = getMaxIOR();
        console.log('Experiment complete!');
        console.log('Peak IOR SOA:', peakSOA.toFixed(1), 'ms');
        console.log('Max IOR magnitude:', maxIOR.toFixed(1), 'ms');
        console.log('Total reversals:', staircase.reversals.length);
        console.log('Y-tracker best:', yTracker.bestSOA, 'ms with IOR', yTracker.bestIOR.toFixed(1), 'ms');
        console.log('SOA bins sampled:', xTracker.getValidBins());
    }
});

// =============================================================================
// EXPERIMENT TIMELINE
// =============================================================================
let timeline = [];

// --- Fullscreen ---
timeline.push({
    type: jsPsychFullscreen,
    fullscreen_mode: true,
    message: '<p style="color: white; font-size: 20px;">The experiment will switch to fullscreen mode.<br><br>Click the button below to continue.</p>',
    button_label: 'Enter Fullscreen'
});

// --- Instructions ---
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="instructions">
            <h2>PEAK IOR EXPERIMENT</h2>
            <p>Focus your eyes on the <strong>plus sign (+)</strong> at all times.</p>
            <p>Two white squares will appear one after the other:</p>
            <ul>
                <li>The <strong>first square</strong> is the cue — <em>ignore it</em></li>
                <li>The <strong>second square</strong> is the target — <em>respond to it</em></li>
            </ul>
            <p><strong>Your task:</strong></p>
            <ul>
                <li>Press <strong>F</strong> if the target appears in the <strong>LEFT</strong> box</li>
                <li>Press <strong>J</strong> if the target appears in the <strong>RIGHT</strong> box</li>
            </ul>
            <p>Respond as <strong>QUICKLY</strong> and <strong>ACCURATELY</strong> as possible.</p>
            <p class="continue-text">Press SPACE to continue</p>
        </div>
    `,
    choices: [' ']
});

// --- Practice Instructions ---
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="instructions">
            <h2>PRACTICE TRIALS</h2>
            <p>You will now have ${N_PRACTICE_TRIALS} practice trials.</p>
            <p>Remember:</p>
            <ul>
                <li>Keep your eyes on the + sign</li>
                <li>Respond only to the second square (target)</li>
                <li>Press <strong>F</strong> for LEFT, <strong>J</strong> for RIGHT</li>
            </ul>
            <p class="continue-text">Press F or J to start practice</p>
        </div>
    `,
    choices: ['f', 'j']
});

// --- Practice Trial Procedure ---
const practiceTrialProcedure = {
    timeline: [
        {
            type: jsPsychCallFunction,
            func: function() {
                setupNewTrial(true);
                practiceTrialCount++;
            }
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() { return generateTrialHTML('fixation'); },
            choices: "NO_KEYS",
            trial_duration: FIXATION_DURATION
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() { return generateTrialHTML('cue'); },
            choices: "NO_KEYS",
            trial_duration: CUE_DURATION
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() { return generateTrialHTML('fixation'); },
            choices: "NO_KEYS",
            trial_duration: function() {
                return Math.max(0, currentTrial.soa - CUE_DURATION);
            }
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() { return generateTrialHTML('target'); },
            choices: ['f', 'j'],
            trial_duration: TARGET_DURATION,
            data: {
                trial_type: 'ior-trial',
                practice: true
            },
            on_finish: function(data) {
                data.cueSide = currentTrial.cueSide;
                data.targetSide = currentTrial.targetSide;
                data.validity = currentTrial.validity;
                data.correctResponse = currentTrial.correctResponse;
                data.soa = currentTrial.soa;
                data.correct = data.response === currentTrial.correctResponse;
            }
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                const lastTrial = jsPsych.data.get().last(1).values()[0];
                if (lastTrial.response === null) {
                    return '<div class="feedback error">Too slow! Respond faster.</div>';
                } else if (!lastTrial.correct) {
                    return '<div class="feedback error">Incorrect! F = Left, J = Right</div>';
                }
                return '';
            },
            choices: "NO_KEYS",
            trial_duration: function() {
                const lastTrial = jsPsych.data.get().last(1).values()[0];
                return (lastTrial.response === null || !lastTrial.correct) ? 1500 : 0;
            }
        }
    ],
    loop_function: function() {
        return practiceTrialCount < N_PRACTICE_TRIALS;
    }
};
timeline.push(practiceTrialProcedure);

// --- Main Experiment Instructions ---
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="instructions">
            <h2>MAIN EXPERIMENT</h2>
            <p>Practice complete! The main experiment will now begin.</p>
            <p>The task will adapt based on your responses.</p>
            <p>Continue until you see the completion screen.</p>
            <p class="continue-text">Press F or J to start</p>
        </div>
    `,
    choices: ['f', 'j']
});

// --- Main Trial Procedure ---
const mainTrialProcedure = {
    timeline: [
        {
            type: jsPsychCallFunction,
            func: function() {
                setupNewTrial(false);
                mainTrialCount++;
            }
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() { return generateTrialHTML('fixation'); },
            choices: "NO_KEYS",
            trial_duration: FIXATION_DURATION
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() { return generateTrialHTML('cue'); },
            choices: "NO_KEYS",
            trial_duration: CUE_DURATION
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() { return generateTrialHTML('fixation'); },
            choices: "NO_KEYS",
            trial_duration: function() {
                return Math.max(0, currentTrial.soa - CUE_DURATION);
            }
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() { return generateTrialHTML('target'); },
            choices: ['f', 'j'],
            trial_duration: TARGET_DURATION,
            data: {
                trial_type: 'ior-trial',
                practice: false
            },
            on_finish: function(data) {
                data.trialNum = mainTrialCount;
                data.cueSide = currentTrial.cueSide;
                data.targetSide = currentTrial.targetSide;
                data.validity = currentTrial.validity;
                data.correctResponse = currentTrial.correctResponse;
                data.soa = currentTrial.soa;
                data.correct = data.response === currentTrial.correctResponse;
                data.nReversals = staircase.reversals.length;
                data.stepSize = staircase.stepSize;
                data.currentSOA = staircase.currentSOA;
                data.bestSOA = yTracker.bestSOA;
                data.bestIOR = yTracker.bestIOR > -Infinity ? yTracker.bestIOR : 0;
                data.reversal = false;

                // Add RT to X-tracker for correct trials
                if (data.correct && data.rt !== null && data.rt > 100) {
                    xTracker.addRT(currentTrial.soa, data.rt, currentTrial.validity);

                    // Update staircase if we have enough data
                    if (shouldUpdateStaircase()) {
                        const { reversal } = updateStaircase();
                        data.reversal = reversal;
                        data.nReversals = staircase.reversals.length;
                        data.bestSOA = yTracker.bestSOA;
                        data.bestIOR = yTracker.bestIOR;
                    }
                }
            }
        },
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                const lastTrial = jsPsych.data.get().last(1).values()[0];
                if (lastTrial.response === null) {
                    return '<div class="feedback error">Too slow!</div>';
                } else if (!lastTrial.correct) {
                    return '<div class="feedback error">Incorrect!</div>';
                }
                return '';
            },
            choices: "NO_KEYS",
            trial_duration: function() {
                const lastTrial = jsPsych.data.get().last(1).values()[0];
                return (lastTrial.response === null || !lastTrial.correct) ? 500 : 0;
            }
        }
    ],
    loop_function: function() {
        return !isStaircaseFinished() && mainTrialCount < N_TRIALS_MAX;
    }
};
timeline.push(mainTrialProcedure);

// --- Results Screen ---
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() {
        const peakSOA = getPeakSOA();
        const maxIOR = getMaxIOR();
        const validBins = xTracker.getValidBins();

        // Create a simple text visualization of the IOR curve
        let curveText = validBins.map(b =>
            `${b.soa}ms: ${b.ior.toFixed(0)}ms`
        ).join(' | ');

        return `
            <div class="results">
                <h2>EXPERIMENT COMPLETE</h2>
                <p>Total trials: ${mainTrialCount}</p>
                <p>Reversals: ${staircase.reversals.length}</p>
                <br>
                <p><strong>Estimated Peak IOR SOA:</strong></p>
                <p style="font-size: 36px; color: #66ff66;">${peakSOA.toFixed(0)} ms</p>
                <p><strong>Maximum IOR magnitude:</strong></p>
                <p style="font-size: 28px; color: #ffaa66;">${maxIOR.toFixed(0)} ms</p>
                <br>
                <p style="font-size: 14px; color: #888;">IOR by SOA: ${curveText}</p>
                <br>
                <p>Thank you for participating!</p>
                <p style="color: #aaa; margin-top: 30px;">Press SPACE to finish and download data</p>
            </div>
        `;
    },
    choices: [' '],
    on_finish: function() {
        const allTrials = jsPsych.data.get().values();
        const mainTrials = allTrials.filter(trial =>
            trial.trial_type === 'ior-trial' && trial.practice === false
        );

        // Create CSV with trial data
        const headers = ['trialNum', 'soa', 'validity', 'rt', 'correct', 'response', 'cueSide', 'targetSide', 'reversal', 'nReversals', 'stepSize', 'bestSOA', 'bestIOR'];
        let csvContent = headers.join(',') + '\n';

        mainTrials.forEach(trial => {
            const row = [
                trial.trialNum,
                trial.soa,
                trial.validity,
                trial.rt !== null && trial.rt !== undefined ? trial.rt : '',
                trial.correct,
                trial.response !== null ? trial.response : '',
                trial.cueSide,
                trial.targetSide,
                trial.reversal,
                trial.nReversals,
                trial.stepSize,
                trial.bestSOA,
                trial.bestIOR !== null && trial.bestIOR !== undefined ? trial.bestIOR.toFixed(1) : ''
            ];
            csvContent += row.join(',') + '\n';
        });

        // Add summary section
        csvContent += '\n# SUMMARY\n';
        csvContent += `# Peak SOA: ${getPeakSOA().toFixed(0)} ms\n`;
        csvContent += `# Max IOR: ${getMaxIOR().toFixed(0)} ms\n`;
        csvContent += `# Y-tracker best SOA: ${yTracker.bestSOA} ms\n`;
        csvContent += `# Reversals: ${staircase.reversals.join(', ')}\n`;
        csvContent += '\n# IOR BY SOA BIN\n';
        csvContent += 'soa_bin,ior,n_valid,n_invalid\n';

        for (const [soa, data] of xTracker.soaBins) {
            const ior = xTracker.getIOR(soa);
            csvContent += `${soa},${ior !== null ? ior.toFixed(1) : ''},${data.validRTs.length},${data.invalidRTs.length}\n`;
        }

        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `peak_ior_${Date.now()}.csv`;
        a.click();
    }
});

// --- Exit Fullscreen ---
timeline.push({
    type: jsPsychFullscreen,
    fullscreen_mode: false
});

// =============================================================================
// RUN EXPERIMENT
// =============================================================================
jsPsych.run(timeline);
</script>
</html>
